<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Next Tier — Product Delivery</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="/config.js?v=2"></script>
<script src="/nt-auth.js?v=2"></script>
<style>
:root {
  --nt-black:#000000;--nt-ice:#1A1A1A;--nt-white:#FFFFFF;
  --nt-green:#AADD00;--nt-green-l:#1E2200;--nt-green-d:#99BF00;
  --nt-slate:#CCCCCC;--nt-muted:#888888;--nt-red:#E8344A;--nt-red-l:#2A0A0C;
  --nt-border:rgba(170,221,0,0.08);--nt-border-strong:rgba(170,221,0,0.18);
  --font-display:'Bebas Neue',sans-serif;
  --font-body:'DM Sans',sans-serif;
  --font-mono:'DM Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-body);background:#0D0D0D;color:var(--nt-white);-webkit-font-smoothing:antialiased;min-height:100vh;}

nav{background:var(--nt-black);display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:56px;border-bottom:1px solid var(--nt-border);position:sticky;top:0;z-index:100;}
.nav-logo{display:flex;align-items:center;text-decoration:none;}
.nav-right{display:flex;align-items:center;gap:12px;}
.btn-logout{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:7px 14px;font-size:12px;color:rgba(255,255,255,.4);cursor:pointer;font-family:var(--font-body);}
.btn-logout:hover{color:var(--nt-white);}
.nav-back{font-size:12px;color:rgba(255,255,255,.4);text-decoration:none;display:flex;align-items:center;gap:6px;}
.nav-back:hover{color:var(--nt-white);}

.page-header{background:var(--nt-black);padding:40px 28px 36px;border-bottom:1px solid var(--nt-border);position:relative;overflow:hidden;}
.page-header::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(170,221,0,0.03) 39px,rgba(170,221,0,0.03) 40px),repeating-linear-gradient(90deg,transparent,transparent 39px,rgba(170,221,0,0.03) 39px,rgba(170,221,0,0.03) 40px);pointer-events:none;}
.page-header-inner{max-width:960px;margin:0 auto;position:relative;}
.page-eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;color:var(--nt-green);text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:10px;}
.page-eyebrow::before{content:'';width:16px;height:1px;background:var(--nt-green);}
.page-title{font-family:var(--font-display);font-size:clamp(32px,4vw,52px);letter-spacing:.02em;line-height:.95;}
.page-title em{color:var(--nt-green);font-style:normal;}

.page-body{max-width:960px;margin:0 auto;padding:36px 24px 80px;}

.section{background:#1E1E1E;border:1px solid var(--nt-border);border-radius:14px;overflow:hidden;margin-bottom:20px;}
.section-head{padding:20px 24px 16px;border-bottom:1px solid var(--nt-border);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.section-title{font-family:var(--font-display);font-size:18px;letter-spacing:.02em;}
.section-count{font-family:var(--font-mono);font-size:11px;color:var(--nt-muted);letter-spacing:.06em;}

.filter-row{display:flex;gap:8px;flex-wrap:wrap;}
.filter-btn{padding:6px 14px;border-radius:6px;border:1px solid var(--nt-border-strong);background:transparent;color:rgba(255,255,255,.4);font-size:12px;cursor:pointer;font-family:var(--font-body);transition:all .15s;}
.filter-btn:hover{color:var(--nt-white);}
.filter-btn.active{border-color:var(--nt-green);background:var(--nt-green-l);color:var(--nt-white);}

table{width:100%;border-collapse:collapse;}
th{font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--nt-muted);padding:10px 16px;text-align:left;border-bottom:1px solid var(--nt-border);}
td{padding:14px 16px;font-size:13px;font-weight:300;color:var(--nt-slate);border-bottom:1px solid var(--nt-border);}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(255,255,255,.02);}

.status-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-family:var(--font-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;}
.status-pill.pending{background:rgba(255,180,0,.1);color:#FFB400;}
.status-pill.active{background:rgba(170,221,0,.1);color:var(--nt-green);}
.status-pill::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;}

.action-btn{background:none;border:1px solid var(--nt-border-strong);border-radius:5px;padding:5px 12px;font-size:11px;cursor:pointer;font-family:var(--font-body);color:#CCCCCC;transition:all .15s;}
.action-btn:hover{background:#0D0D0D;}
.action-btn.deliver{border-color:rgba(170,221,0,.3);color:var(--nt-green);}
.action-btn.deliver:hover{background:var(--nt-green-l);}

/* DELIVERY PANEL */
.deliver-panel{display:none;background:#161616;border-top:1px solid var(--nt-border);padding:20px 24px;}
.deliver-panel.open{display:block;}
.deliver-panel-title{font-family:var(--font-display);font-size:16px;letter-spacing:.02em;margin-bottom:16px;}
.deliver-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
.deliver-field label{display:block;font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--nt-muted);margin-bottom:6px;}
.deliver-field input,.deliver-field textarea{width:100%;background:#111111;border:1px solid var(--nt-border-strong);border-radius:8px;padding:10px 14px;font-size:13px;font-weight:300;color:var(--nt-white);font-family:var(--font-body);outline:none;transition:border-color .15s;}
.deliver-field input:focus,.deliver-field textarea:focus{border-color:var(--nt-green);}
.deliver-field textarea{resize:vertical;min-height:80px;}
.deliver-actions{display:flex;gap:10px;margin-top:4px;}
.btn-deliver{background:var(--nt-green);color:#000;border:none;border-radius:7px;padding:10px 22px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font-body);transition:background .15s;}
.btn-deliver:hover{background:#99CC00;}
.btn-deliver:disabled{opacity:.6;cursor:not-allowed;}
.btn-cancel-deliver{background:transparent;color:rgba(255,255,255,.4);border:1px solid var(--nt-border-strong);border-radius:7px;padding:10px 18px;font-size:13px;cursor:pointer;font-family:var(--font-body);}

.empty-state{padding:48px;text-align:center;color:var(--nt-muted);font-size:13px;font-weight:300;}

.loading-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:999;flex-direction:column;gap:16px;}
.loading-overlay.active{display:flex;}
.loading-text{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--nt-muted);}

/* REPORT VIEWER MODAL */
.report-modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;display:none;flex-direction:column;}
.report-modal.open{display:flex;}
.report-modal-bar{background:#111;border-bottom:1px solid var(--nt-border);padding:0 20px;height:52px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.report-modal-title{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--nt-muted);}
.report-modal-actions{display:flex;align-items:center;gap:10px;}
.report-modal-actions a{font-size:12px;color:var(--nt-green);text-decoration:none;padding:6px 14px;border:1px solid rgba(170,221,0,.25);border-radius:5px;}
.report-modal-actions a:hover{background:var(--nt-green-l);}
.btn-close-modal{background:none;border:1px solid rgba(255,255,255,.1);border-radius:5px;padding:6px 14px;font-size:12px;color:rgba(255,255,255,.4);cursor:pointer;font-family:var(--font-body);}
.btn-close-modal:hover{color:var(--nt-white);}
.report-modal iframe{flex:1;border:none;background:#fff;}
.report-modal-loader{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#111;}
.report-modal-loader-text{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#888;}
@keyframes nt-spin{to{transform:rotate(360deg);}}
.report-modal-spinner{width:32px;height:32px;border:2px solid rgba(170,221,0,0.15);border-top-color:#AADD00;border-radius:50%;animation:nt-spin .8s linear infinite;}

@media(max-width:720px){
  .deliver-grid{grid-template-columns:1fr;}
  table{display:block;overflow-x:auto;}
  .page-body{padding:24px 16px 60px;}
}
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <img src="/nexttierlogo.png" alt="" style="height:40px;opacity:.5;">
  <div class="loading-text" id="loadingText">Loading…</div>
</div>

<div class="report-modal" id="reportModal">
  <div class="report-modal-bar">
    <div class="report-modal-title" id="reportModalTitle">Report preview</div>
    <div class="report-modal-actions">
      <a id="reportModalDownload" href="#" target="_blank">Open in Drive ↗</a>
      <button class="btn-close-modal" onclick="closeReportModal()">Close ✕</button>
    </div>
  </div>
  <div class="report-modal-loader" id="reportModalLoader">
    <div class="report-modal-spinner"></div>
    <div class="report-modal-loader-text">Loading report…</div>
  </div>
  <iframe id="reportModalFrame" src="" allowfullscreen style="display:none;"></iframe>
</div>

<nav>
  <a href="/" class="nav-logo"><img src="/nexttierlogo.png" alt="Next Tier" style="height:40px;width:auto;"></a>
  <div class="nav-right">
    <a href="/dashboard%20admin" class="nav-back">← Admin dashboard</a>
    <button class="btn-logout" onclick="NT.logout()">Sign out</button>
  </div>
</nav>

<div class="page-header">
  <div class="page-header-inner">
    <div class="page-eyebrow">Admin</div>
    <div class="page-title">PRODUCT <em>DELIVERY</em></div>
  </div>
</div>

<div class="page-body">

  <div class="section">
    <div class="section-head">
      <div>
        <div class="section-title">ALL PRODUCTS</div>
        <div class="section-count" id="productCount">—</div>
      </div>
      <div class="filter-row">
        <button class="filter-btn active" onclick="setFilter('all')">All</button>
        <button class="filter-btn" onclick="setFilter('pending')">Pending</button>
        <button class="filter-btn" onclick="setFilter('active')">Delivered</button>
      </div>
    </div>
    <div id="tableWrap">
      <div class="empty-state">Loading products…</div>
    </div>
  </div>

</div>

<script>
let _allProducts   = [];
let _filter        = 'all';
let _openProductId = null;
let _token         = '';
let _fallbackTimer = null;

window.addEventListener('DOMContentLoaded', async () => {
  document.getElementById('loadingOverlay').classList.add('active');

  const user = NT.getUser();
  if (!user) { window.location.href = '/login?redirect=/admin-products'; return; }

  const valid = await NT.validate();
  if (!valid || valid.role !== 'admin') {
    window.location.href = '/dashboard%20' + (valid?.role || 'player');
    return;
  }

  _token = NT.getToken();
  document.getElementById('loadingOverlay').classList.remove('active');

  await loadProducts();
});

async function loadProducts() {
  const encoded = encodeURIComponent(JSON.stringify({ type: 'listProducts', token: _token }));
  let res;
  try {
    const r = await fetch(NT_API_URL + '?payload=' + encoded);
    res = await r.json();
  } catch (err) {
    document.getElementById('tableWrap').innerHTML =
      '<div class="empty-state">Network error — could not reach the API.<br><small style="color:#555;">' + err.message + '</small></div>';
    return;
  }

  if (res.status !== 'ok') {
    document.getElementById('tableWrap').innerHTML =
      '<div class="empty-state">API error: ' + (res.message || JSON.stringify(res)) + '</div>';
    return;
  }

  _allProducts = res.products || [];
  renderTable();
}

function setFilter(f) {
  _filter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  renderTable();
}

function renderTable() {
  const products = _filter === 'all'
    ? _allProducts
    : _allProducts.filter(p => (_filter === 'active' ? p.status === 'active' : p.status !== 'active'));

  const pending = _allProducts.filter(p => p.status !== 'active').length;
  const total   = _allProducts.length;
  document.getElementById('productCount').textContent = `${total} total · ${pending} pending`;

  if (!products.length) {
    document.getElementById('tableWrap').innerHTML = '<div class="empty-state">No products found.</div>';
    return;
  }

  const rows = products.map(p => {
    const name    = [p.firstName, p.lastName].filter(Boolean).join(' ') || '—';
    const date    = p.createdAt ? new Date(p.createdAt).toLocaleDateString('en-CA') : '—';
    const isPend  = p.status !== 'active';
    const fileDisp = p.reportUrl
      ? `<a href="#" class="view-report-link" data-id="${escHtml(p.id)}" style="color:var(--nt-green);font-size:12px;">View ↗</a>`
      : '<span style="color:var(--nt-muted);">—</span>';
    const deliverBtn = isPend
      ? `<button class="action-btn deliver" onclick="toggleDeliver('${p.id}')">Deliver →</button>`
      : `<button class="action-btn" onclick="toggleDeliver('${p.id}')">Update link</button>`;

    return `
      <tr id="row-${p.id}">
        <td style="font-weight:400;color:#fff;">${escHtml(name)}</td>
        <td>${escHtml(p.package || '—')}</td>
        <td>${escHtml(p.position || '—')}</td>
        <td>${escHtml(p.team || '—')}</td>
        <td>${date}</td>
        <td id="fileCell-${p.id}">${fileDisp}</td>
        <td id="statusCell-${p.id}"><span class="status-pill ${p.status === 'active' ? 'active' : 'pending'}">${p.status || 'pending'}</span></td>
        <td id="actionCell-${p.id}">${deliverBtn}</td>
      </tr>
      <tr id="panel-${p.id}" style="display:none;">
        <td colspan="8" style="padding:0;">
          <div class="deliver-panel open" id="panelBody-${p.id}">
            <div class="deliver-panel-title">Deliver report — ${escHtml(name)}</div>
            <div class="deliver-field" style="margin-bottom:16px;">
              <label>Report file <span style="color:var(--nt-green)">*</span></label>
              <input type="file" id="file-${p.id}" accept=".pdf,.doc,.docx,.png,.jpg,.jpeg,.html,.htm"
                style="display:block;width:100%;background:#111;border:1px solid var(--nt-border-strong);border-radius:8px;padding:10px 14px;color:var(--nt-slate);font-family:var(--font-body);font-size:13px;cursor:pointer;"
                onchange="onFileSelected('${p.id}', this)">
              <div id="fileInfo-${p.id}" style="margin-top:8px;font-size:11px;color:var(--nt-muted);display:none;"></div>
            </div>
            <div id="progressWrap-${p.id}" style="display:none;margin-bottom:14px;">
              <div id="progressText-${p.id}" style="font-family:var(--font-mono);font-size:11px;letter-spacing:.07em;color:var(--nt-green);text-transform:uppercase;"></div>
              <div style="margin-top:8px;height:2px;background:var(--nt-border);border-radius:2px;overflow:hidden;">
                <div id="progressBar-${p.id}" style="height:100%;background:var(--nt-green);width:0%;transition:width .4s;"></div>
              </div>
            </div>
            <div class="deliver-actions">
              <button class="btn-deliver" id="btnDeliver-${p.id}" onclick="deliverProduct('${p.id}')">Upload &amp; Deliver</button>
              <button class="btn-cancel-deliver" id="btnCancel-${p.id}" onclick="toggleDeliver('${p.id}')">Cancel</button>
            </div>
            <div id="panelMsg-${p.id}" style="margin-top:12px;font-size:13px;padding:10px 14px;border-radius:8px;display:none;"></div>
          </div>
        </td>
      </tr>`;
  }).join('');

  document.getElementById('tableWrap').innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Player</th><th>Package</th><th>Position</th><th>Team</th>
          <th>Submitted</th><th>Report</th><th>Status</th><th>Action</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function toggleDeliver(id) {
  if (_openProductId && _openProductId !== id) {
    document.getElementById('panel-' + _openProductId).style.display = 'none';
  }
  const row = document.getElementById('panel-' + id);
  const isOpen = row.style.display !== 'none';
  row.style.display = isOpen ? 'none' : '';
  _openProductId = isOpen ? null : id;
}

function onFileSelected(id, input) {
  const info = document.getElementById('fileInfo-' + id);
  if (!input.files || !input.files[0]) { info.style.display = 'none'; return; }
  const f    = input.files[0];
  const size = f.size > 1024 * 1024
    ? (f.size / 1024 / 1024).toFixed(1) + ' MB'
    : (f.size / 1024).toFixed(0) + ' KB';
  info.textContent  = f.name + ' · ' + size;
  info.style.display = '';
}

function setProgress(id, text, pct) {
  const wrap = document.getElementById('progressWrap-' + id);
  const txt  = document.getElementById('progressText-' + id);
  const bar  = document.getElementById('progressBar-' + id);
  if (!text) { wrap.style.display = 'none'; return; }
  wrap.style.display = '';
  txt.textContent    = text;
  bar.style.width    = pct + '%';
}

function readFileAsBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload  = e => resolve(e.target.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function deliverProduct(id) {
  const fileInput = document.getElementById('file-' + id);
  const btn       = document.getElementById('btnDeliver-' + id);
  const cancelBtn = document.getElementById('btnCancel-' + id);
  const msg       = document.getElementById('panelMsg-' + id);

  if (!fileInput?.files?.[0]) {
    showMsg(msg, 'Please select a file to upload.', 'error');
    return;
  }

  const file = fileInput.files[0];
  if (file.size > 10 * 1024 * 1024) {
    showMsg(msg, 'File must be under 10 MB. Compress or split the file and try again.', 'error');
    return;
  }

  btn.disabled       = true;
  cancelBtn.disabled = true;
  msg.style.display  = 'none';

  try {
    setProgress(id, 'Reading file…', 30);
    const base64 = await readFileAsBase64(file);

    setProgress(id, 'Uploading to Drive…', 65);
    const res = await fetch(NT_API_URL, {
      method:  'POST',
      headers: { 'Content-Type': 'text/plain' },
      body:    JSON.stringify({
        type:      'uploadReport',
        token:     _token,
        productId: id,
        fileName:  file.name,
        mimeType:  file.type || 'application/octet-stream',
        fileData:  base64
      })
    }).then(r => r.json());

    setProgress(id, 'Finishing…', 90);

    if (res.status === 'ok') {
      const reportUrl = res.reportUrl;
      setProgress(id, 'Delivered ✓', 100);

      document.getElementById('panel-' + id).style.display  = 'none';
      document.getElementById('statusCell-' + id).innerHTML = '<span class="status-pill active">active</span>';
      document.getElementById('fileCell-' + id).innerHTML =
        `<a href="#" class="view-report-link" data-id="${id}" style="color:var(--nt-green);font-size:12px;">View ↗</a>`;
      document.getElementById('actionCell-' + id).innerHTML =
        `<button class="action-btn" onclick="toggleDeliver('${id}')">Replace file</button>`;

      const p = _allProducts.find(x => x.id === id);
      if (p) { p.status = 'active'; p.reportUrl = reportUrl; }

      const row = document.getElementById('row-' + id);
      row.style.background = 'rgba(170,221,0,0.06)';
      setTimeout(() => { row.style.background = ''; }, 2500);

      document.getElementById('productCount').textContent =
        _allProducts.length + ' total · ' +
        _allProducts.filter(x => x.status !== 'active').length + ' pending';
    } else {
      setProgress(id, '', 0);
      showMsg(msg, 'Error: ' + (res.message || 'Upload failed — check Apps Script logs.'), 'error');
      btn.disabled       = false;
      cancelBtn.disabled = false;
    }
  } catch (err) {
    setProgress(id, '', 0);
    showMsg(msg, 'Network error: ' + err.message, 'error');
    btn.disabled       = false;
    cancelBtn.disabled = false;
  }
}

function showMsg(el, text, type) {
  el.textContent = text;
  if (type === 'error') {
    el.style.background = 'rgba(232,52,74,0.1)';
    el.style.border     = '1px solid rgba(232,52,74,0.2)';
    el.style.color      = 'var(--nt-red)';
  } else if (type === 'warn') {
    el.style.background = 'rgba(255,180,0,0.1)';
    el.style.border     = '1px solid rgba(255,180,0,0.2)';
    el.style.color      = '#FFB400';
  } else {
    el.style.background = 'rgba(170,221,0,0.08)';
    el.style.border     = '1px solid rgba(170,221,0,0.15)';
    el.style.color      = 'var(--nt-green)';
  }
  el.style.display = '';
}

function escHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function buildBlobUrl(res) {
  if (res.isBase64) {
    const binary = atob(res.content);
    const bytes  = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return URL.createObjectURL(new Blob([bytes], { type: res.mimeType }));
  }
  return URL.createObjectURL(new Blob([res.content], { type: res.mimeType || 'text/html' }));
}

async function openReportById(id) {
  const p = _allProducts.find(x => x.id === id);
  if (!p || !p.reportUrl) return;

  const previewUrl = p.reportUrl.replace('/view', '/preview');
  const frame  = document.getElementById('reportModalFrame');
  const loader = document.getElementById('reportModalLoader');
  const name   = [p.firstName, p.lastName].filter(Boolean).join(' ') || '';

  if (_fallbackTimer) { clearTimeout(_fallbackTimer); _fallbackTimer = null; }
  frame.onload         = null;
  frame.srcdoc         = '';
  frame.src            = '';
  frame.style.display  = 'none';
  loader.style.display = '';
  loader.innerHTML     = '<div class="report-modal-spinner"></div><div class="report-modal-loader-text">Loading report…</div>';

  document.getElementById('reportModalDownload').href = p.reportUrl;
  document.getElementById('reportModalTitle').textContent = name ? 'Report — ' + name : 'Report';
  document.getElementById('reportModal').classList.add('open');
  document.body.style.overflow = 'hidden';

  _fallbackTimer = setTimeout(() => {
    loader.innerHTML =
      '<p style="font-family:sans-serif;font-size:13px;color:#888;margin-bottom:16px;">Preview unavailable.</p>' +
      '<a href="' + p.reportUrl + '" target="_blank" style="font-family:sans-serif;font-size:13px;color:#AADD00;' +
      'border:1px solid rgba(170,221,0,.25);padding:8px 18px;border-radius:5px;text-decoration:none;">Open in Google Drive ↗</a>';
  }, 12000);

  let apiRes = null;
  try {
    apiRes = await fetch(NT_API_URL, {
      method:  'POST',
      headers: { 'Content-Type': 'text/plain' },
      body:    JSON.stringify({ type: 'viewReport', token: _token, productId: id })
    }).then(r => r.json());
  } catch (_) {}

  frame.onload = () => {
    clearTimeout(_fallbackTimer);
    _fallbackTimer       = null;
    loader.style.display = 'none';
    frame.style.display  = '';
    frame.onload         = null;
  };

  if (apiRes && apiRes.status === 'ok' && !apiRes.isBase64) {
    frame.srcdoc = apiRes.content;
  } else if (apiRes && apiRes.status === 'ok') {
    frame.srcdoc = '';
    frame.src    = buildBlobUrl(apiRes);
  } else {
    frame.srcdoc = '';
    frame.src    = previewUrl;
  }
}

function closeReportModal() {
  if (_fallbackTimer) { clearTimeout(_fallbackTimer); _fallbackTimer = null; }
  const frame  = document.getElementById('reportModalFrame');
  const loader = document.getElementById('reportModalLoader');
  document.getElementById('reportModal').classList.remove('open');
  frame.onload         = null;
  frame.srcdoc         = '';
  frame.src            = '';
  frame.style.display  = 'none';
  loader.style.display = '';
  document.body.style.overflow = '';
}

document.addEventListener('click', e => {
  const link = e.target.closest('.view-report-link');
  if (link) { e.preventDefault(); openReportById(link.dataset.id); }
});

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeReportModal(); });
</script>
</body>
</html>
