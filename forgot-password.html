<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Next Tier — Forgot Password</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/config.js?v=3"></script>
<script src="/nt-auth.js?v=2"></script>
<style>
:root {
  --nt-black: #000000; --nt-ice: #1A1A1A; --nt-white: #FFFFFF;
  --nt-green: #AADD00; --nt-green-d: #99BF00; --nt-green-l: #1E2200;
  --nt-red: #E8344A; --nt-slate: #CCCCCC; --nt-muted: #888888;
  --nt-border: rgba(170,221,0,0.08); --nt-border-strong: rgba(170,221,0,0.18);
  --font-display: 'Bebas Neue', sans-serif;
  --font-body: 'DM Sans', sans-serif;
  --font-mono: 'DM Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-body); background: var(--nt-black);
  min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 24px; -webkit-font-smoothing: antialiased;
}
.auth-logo { display:flex; align-items:center; justify-content:center; text-decoration:none; margin-bottom:36px; }
.auth-card {
  background: #1E1E1E; border-radius: 16px;
  width: 100%; max-width: 420px; overflow: hidden;
}
.auth-body { padding: 28px; }
.auth-title {
  font-family: var(--font-display); font-size: 28px;
  letter-spacing: .02em; color: var(--nt-white);
  margin-bottom: 4px;
}
.auth-sub { font-size: 13px; font-weight: 300; color: var(--nt-muted); margin-bottom: 24px; }
.form-group { margin-bottom: 16px; }
.form-group label {
  display: block; font-size: 11px; font-weight: 500;
  letter-spacing: .06em; text-transform: uppercase;
  color: var(--nt-muted); margin-bottom: 6px; font-family: var(--font-mono);
}
.form-group input {
  width: 100%; background: #111111;
  border: 1px solid var(--nt-border-strong); border-radius: 8px;
  padding: 10px 14px; font-size: 14px; font-weight: 300;
  color: var(--nt-white); font-family: var(--font-body);
  outline: none; transition: border-color .15s;
}
.form-group input:focus { border-color: var(--nt-green); background: #1E1E1E; }
.btn-auth {
  width: 100%; background: var(--nt-green); color: #000000;
  border: none; border-radius: 8px; padding: 13px;
  font-size: 14px; font-weight: 600; font-family: var(--font-body);
  cursor: pointer; transition: background .15s; margin-top: 20px;
}
.btn-auth:hover { background: #23D98C; }
.btn-auth:disabled { opacity: .6; cursor: not-allowed; }
.auth-error {
  margin-top: 14px; padding: 10px 14px;
  background: #2A0A0C; border: 1px solid rgba(232,52,74,.2);
  border-radius: 7px; font-size: 13px; color: var(--nt-red); display: none;
}
.auth-success {
  margin-top: 14px; padding: 10px 14px;
  background: var(--nt-green-l); border: 1px solid rgba(170,221,0,.2);
  border-radius: 7px; font-size: 13px; color: var(--nt-green-d); display: none;
}
.auth-footer {
  text-align: center; margin-top: 20px;
  font-size: 12px; color: rgba(255,255,255,0.25);
}
.auth-footer a { color: rgba(255,255,255,0.4); }

@media (max-width: 480px) {
  .auth-logo { margin-bottom: 24px; }
  .auth-logo img { height: 44px; }
  .auth-body { padding: 20px; }
}
</style>
</head>
<body>

<a href="/" class="auth-logo"><img src="/nexttierlogo.png" alt="Next Tier" style="height:56px;width:auto;"></a>

<div class="auth-card">
  <div class="auth-body">
    <div class="auth-title">FORGOT PASSWORD</div>
    <div class="auth-sub">Enter your email and we'll send you a reset link</div>
    <div class="form-group">
      <label>Email address</label>
      <input type="email" id="resetEmail" placeholder="you@email.com" autocomplete="email">
    </div>
    <button class="btn-auth" id="btnReset" onclick="doRequestReset()">Send reset link →</button>
    <div class="auth-error"   id="resetError"></div>
    <div class="auth-success" id="resetSuccess"></div>
  </div>
</div>

<div class="auth-footer">
  <a href="/login">← Back to sign in</a>
</div>

<script>
function showErr(el, msg) { el.textContent = msg; el.style.display = 'block'; }

async function doRequestReset() {
  const email  = document.getElementById('resetEmail').value.trim();
  const errEl  = document.getElementById('resetError');
  const sucEl  = document.getElementById('resetSuccess');
  const btn    = document.getElementById('btnReset');
  errEl.style.display = 'none';
  sucEl.style.display = 'none';

  if (!email) { showErr(errEl, 'Please enter your email address.'); return; }

  btn.disabled = true; btn.textContent = 'Sending…';

  const resetUrlBase = window.location.origin + '/reset-password';

  try {
    await NT.api({ type: 'requestReset', email, resetUrlBase });
    sucEl.textContent = 'If an account exists with that email, a reset link has been sent. Check your inbox.';
    sucEl.style.display = 'block';
    btn.textContent = 'Sent';
  } catch (e) {
    showErr(errEl, 'Something went wrong. Please try again.');
    btn.disabled = false; btn.textContent = 'Send reset link →';
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') doRequestReset();
});
</script>
</body>
</html>
