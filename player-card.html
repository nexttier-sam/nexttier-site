<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Player Card · Next Tier</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/config.js"></script>
<script src="/nt-auth.js"></script>
<style>
:root[data-theme="dark"]{
  --bg:#000;--bg-card:#111;--bg-el:#1a1a1a;--bg-row:#1f1f1f;--bg-hi:#1c2200;
  --border:rgba(170,204,0,.15);--border-s:rgba(170,204,0,.07);
  --txt:#fff;--txt2:#ccc;--muted:#666;
  --green:#AACC00;--str-bg:#1c2200;--str-brd:rgba(170,204,0,.25);--str-txt:#AACC00;
  --orange:#f59e0b;--red:#ef4444;--blue:#60a5fa;
  --bar-bg:#2a2a2a;--bar-g:#4ade6e;--bar-y:#f59e0b;--bar-r:#ef4444;
  --flg-bg:#2a0a0a;--flg-brd:#4a1a1a;--flg-txt:#ef4444;
  --prj-bg:#0a1020;--prj-brd:#1a2a40;--prj-txt:#60a5fa;
  --shadow:0 4px 24px rgba(0,0,0,.8);
}
:root[data-theme="light"]{
  --bg:#f0f0f0;--bg-card:#fff;--bg-el:#f5f5f5;--bg-row:#eee;--bg-hi:#f0ff99;
  --border:rgba(0,0,0,.15);--border-s:rgba(0,0,0,.07);
  --txt:#000;--txt2:#2a2a2a;--muted:#666;
  --green:#7aaa00;--str-bg:#f0ff99;--str-brd:#b3dd00;--str-txt:#5a7a00;
  --orange:#d97706;--red:#dc2626;--blue:#2563eb;
  --bar-bg:#e0e0e0;--bar-g:#16a34a;--bar-y:#d97706;--bar-r:#dc2626;
  --flg-bg:#fef2f2;--flg-brd:#fecaca;--flg-txt:#dc2626;
  --prj-bg:#eff6ff;--prj-brd:#bfdbfe;--prj-txt:#1d4ed8;
  --shadow:0 4px 24px rgba(0,0,0,.1);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden;transition:background .3s,color .3s;}

.loading-overlay{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:999;}

/* Theme toggle */
.toggle-wrap{position:fixed;bottom:20px;right:20px;z-index:1000;display:flex;align-items:center;gap:10px;background:var(--bg-card);border:1px solid var(--border);border-radius:30px;padding:8px 14px;box-shadow:var(--shadow);cursor:pointer;user-select:none;transition:border-color .2s;}
.toggle-wrap:hover{border-color:var(--green);}
.toggle-lbl{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--txt2);}
.toggle-sw{width:36px;height:20px;background:var(--bg-row);border:1px solid var(--border);border-radius:10px;position:relative;transition:background .3s;}
[data-theme="light"] .toggle-sw{background:var(--green);}
.toggle-sw::after{content:'';position:absolute;width:14px;height:14px;background:#fff;border-radius:50%;top:2px;left:2px;transition:left .25s;box-shadow:0 1px 4px rgba(0,0,0,.3);}
[data-theme="light"] .toggle-sw::after{left:18px;}

/* Section nav */
.snav{position:sticky;top:0;z-index:100;background:var(--bg-card);border-bottom:1px solid var(--border);display:flex;align-items:center;height:48px;padding:0 16px;gap:0;}
.snav-brand{display:flex;align-items:center;text-decoration:none;flex-shrink:0;margin-right:8px;}
.snav-links{display:flex;align-items:center;flex:1;overflow-x:auto;}
.snav-link{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:0 14px;height:48px;display:flex;align-items:center;text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer;transition:color .15s,border-color .15s;}
.snav-link:hover{color:var(--txt2);}
.snav-link.active{color:var(--green);border-bottom-color:var(--green);}
.snav-right{display:flex;align-items:center;gap:10px;flex-shrink:0;margin-left:auto;}
.snav-user{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:.06em;}
.snav-logout{background:transparent;border:1px solid var(--border);border-radius:3px;padding:5px 10px;font-size:11px;color:var(--muted);cursor:pointer;font-family:'Barlow',sans-serif;}
.snav-logout:hover{color:var(--txt2);}

/* Layout */
.pw{max-width:1100px;margin:0 auto;padding:20px 16px 80px;}

/* Section label */
.sec-lbl{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border-s);display:flex;justify-content:space-between;}

/* Card */
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:4px;margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow);}

/* Page 1: Player header */
.player-header{display:grid;grid-template-columns:220px 1fr;min-height:240px;}
.photo-col{background:var(--bg-el);border-right:1px solid var(--border);padding:20px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;}
.player-photo{width:88px;height:88px;border-radius:50%;background:var(--bg-row);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}
.player-name{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:800;letter-spacing:.02em;text-align:center;line-height:1.1;text-transform:uppercase;}
.team-info{text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:11px;color:var(--txt2);letter-spacing:.06em;line-height:1.5;}
.tag-row{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;}
.tag{background:var(--bg-row);border:1px solid var(--border);border-radius:3px;font-family:'IBM Plex Mono',monospace;font-size:9px;padding:3px 7px;color:var(--txt2);letter-spacing:.06em;}
.tag.g{background:var(--str-bg);border-color:var(--str-brd);color:var(--str-txt);}
.pds-badge{text-align:center;}
.pds-num{font-family:'Barlow Condensed',sans-serif;font-size:48px;font-weight:800;color:var(--txt);line-height:1;}
.pds-key{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;}
.stats-col{padding:18px 20px;display:flex;flex-direction:column;justify-content:center;gap:12px;}
.glance-lbl{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;}
.stat-boxes{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;}
.stat-boxes.r3{grid-template-columns:repeat(3,1fr);}
.stat-box{background:var(--bg-el);border:1px solid var(--border);border-radius:3px;padding:9px 10px;text-align:center;}
.stat-val{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;color:var(--txt);line-height:1;}
.stat-val.g{color:var(--green);}
.stat-key{font-family:'IBM Plex Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-top:3px;}
.career-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.ctbl{width:100%;border-collapse:collapse;font-size:12px;}
.ctbl th{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px;text-align:center;border-bottom:1px solid var(--border);background:var(--bg-el);white-space:nowrap;}
.ctbl th:first-child{text-align:left;}
.ctbl td{padding:8px;border-bottom:1px solid var(--border-s);color:var(--txt2);text-align:center;white-space:nowrap;}
.ctbl td:first-child{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:.05em;}
.ctbl tr.cur td{color:var(--green);font-weight:600;background:var(--bg-hi);}
.star{display:inline-block;background:var(--green);color:#000;font-size:8px;font-weight:700;padding:1px 4px;border-radius:2px;margin-left:4px;font-family:'IBM Plex Mono',monospace;}

/* Page 2: Scout assessment */
.scout-grid{display:grid;grid-template-columns:220px 1fr;}
.info-col{border-right:1px solid var(--border);padding:20px;}
.info-tbl{width:100%;}
.info-tbl td{padding:7px 0;border-bottom:1px solid var(--border-s);font-size:12px;}
.info-tbl tr:last-child td{border-bottom:none;}
.info-lbl{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;padding-right:12px;white-space:nowrap;}
.info-val{color:var(--txt);font-weight:500;font-size:12px;}
.info-val.orange{color:var(--orange);}
.exec-box{margin-top:14px;padding:12px;background:var(--bg-el);border:1px solid var(--border);border-radius:3px;}
.exec-title{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:8px;}
.exec-body{font-size:11px;color:var(--txt2);line-height:1.6;}
.legend-box{margin-top:12px;padding:10px 12px;background:var(--bg-el);border:1px solid var(--border);border-radius:3px;}
.legend-title{font-family:'IBM Plex Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;}
.legend-item{font-size:10px;color:var(--txt2);margin-bottom:5px;display:flex;align-items:flex-start;gap:8px;}
.l-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0;margin-top:1px;}
.l-g{background:var(--bar-g);}.l-y{background:var(--bar-y);}.l-r{background:var(--bar-r);}

/* Skills */
.skills-col{padding:20px 36px 20px 20px;}
.skill-axis{display:flex;justify-content:space-between;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border-s);}
.axis-lbl{font-family:'IBM Plex Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;}
.skill-row{display:grid;grid-template-columns:130px 1fr;align-items:center;gap:10px;margin-bottom:9px;}
.skill-name{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--txt2);}
.skill-bar-wrap{position:relative;padding:10px 0;}
.skill-bar-bg{background:var(--bar-bg);border-radius:2px;height:5px;position:relative;overflow:visible;}
.skill-bar-fill{height:100%;border-radius:2px;position:relative;transition:width .8s cubic-bezier(.4,0,.2,1);}
.fill-green{background:var(--bar-g);}.fill-yellow{background:var(--bar-y);}.fill-red{background:var(--bar-r);}
.skill-bubble{position:absolute;right:-16px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;z-index:2;box-shadow:0 1px 6px rgba(0,0,0,.5);}
.bubble-green{background:var(--bar-g);color:#000;}.bubble-yellow{background:var(--bar-y);color:#000;}.bubble-red{background:var(--bar-r);color:#fff;}
.skill-note{grid-column:2/-1;font-size:10px;color:var(--muted);font-style:italic;margin-top:-6px;margin-bottom:4px;}

/* Pathway table */
.pw-tbl{width:100%;border-collapse:collapse;}
.pw-tbl th{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px 14px;text-align:left;border-bottom:1px solid var(--border);}
.pw-tbl td{padding:12px 14px;border-bottom:1px solid var(--border-s);font-size:12px;color:var(--txt2);}
.pw-tbl tr:last-child td{border-bottom:none;}
.pw-name{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:var(--txt);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:3px;}
.pw-sub{font-size:10px;color:var(--muted);}
.match-pct{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;line-height:1;}
.match-pct.green{color:var(--green);}.match-pct.orange{color:var(--orange);}.match-pct.red{color:var(--red);}
.tl-val{font-family:'IBM Plex Mono',monospace;font-size:11px;}

/* Dev notes */
.note-sec{padding:20px 24px;border-bottom:1px solid var(--border-s);}
.note-sec:last-of-type{border-bottom:none;}
.note-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.note-badge{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:2px;}
.nb-str{background:var(--str-bg);color:var(--str-txt);border:1px solid var(--str-brd);}
.nb-flg{background:var(--flg-bg);color:var(--flg-txt);border:1px solid var(--flg-brd);}
.nb-prj{background:var(--prj-bg);color:var(--prj-txt);border:1px solid var(--prj-brd);}
.note-title{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--txt);}
.note-body{font-size:13px;line-height:1.7;color:var(--txt2);}
.note-body strong{color:var(--txt);font-weight:600;}

/* Projection footer */
.proj-footer{display:grid;grid-template-columns:repeat(4,1fr);}
.proj-cell{padding:16px 20px;border-right:1px solid var(--border-s);text-align:center;}
.proj-cell:last-child{border-right:none;}
.proj-key{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;}
.proj-val{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;color:var(--txt);line-height:1;}
.proj-val.g{color:var(--green);}.proj-val.b{color:var(--blue);}.proj-val.o{color:var(--orange);}

/* How to read */
.htr{display:grid;grid-template-columns:repeat(3,1fr);}
.htr-item{padding:16px 20px;border-right:1px solid var(--border-s);}
.htr-item:last-child{border-right:none;}
.htr-num{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:.08em;margin-bottom:4px;text-transform:uppercase;}
.htr-title{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:800;color:var(--green);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;}
.htr-body{font-size:11px;color:var(--txt2);line-height:1.6;}

/* Coach note */
.coach-note{margin:12px 16px 0;padding:10px 14px;background:var(--bg-el);border:1px solid var(--border);border-left:3px solid var(--blue);border-radius:3px;}
.coach-note-lbl{font-family:'IBM Plex Mono',monospace;font-size:8px;color:var(--blue);letter-spacing:.14em;text-transform:uppercase;margin-bottom:5px;}
.coach-note-txt{font-size:11px;color:var(--txt2);line-height:1.6;font-style:italic;}

/* Doc footer */
.doc-footer{padding:10px 20px;background:var(--bg-el);border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.footer-id{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:.1em;}
.footer-brand{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--green);text-transform:uppercase;}
.conf-bar{padding:5px 12px;font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:.15em;text-transform:uppercase;text-align:center;background:repeating-linear-gradient(45deg,transparent,transparent 8px,var(--border-s) 8px,var(--border-s) 9px);}

/* Parent view */
.parent-hero{padding:24px;border-bottom:1px solid var(--border-s);display:flex;align-items:center;gap:24px;}
.parent-name{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:800;text-transform:uppercase;line-height:1;margin-bottom:4px;}
.parent-sub{font-size:13px;color:var(--txt2);}
.parent-ring{width:80px;height:80px;border-radius:50%;border:3px solid var(--green);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;background:var(--bg-el);}
.parent-ring-num{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:800;color:var(--green);line-height:1;}
.parent-ring-key{font-family:'IBM Plex Mono',monospace;font-size:7px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;}
.metric-row{display:grid;grid-template-columns:120px 1fr 80px;gap:12px;padding:14px 20px;border-bottom:1px solid var(--border-s);align-items:start;}
.metric-label{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;color:var(--txt);text-transform:uppercase;letter-spacing:.04em;}
.metric-ctx{font-size:10px;color:var(--muted);margin-top:2px;}
.metric-desc{font-size:11px;color:var(--txt2);line-height:1.6;}
.metric-val{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;text-align:right;line-height:1.1;}
.metric-val.g{color:var(--green);}.metric-val.r{color:var(--red);}.metric-val.y{color:var(--orange);}
.verdict-row{display:flex;gap:12px;align-items:flex-start;padding:16px 20px;border-bottom:1px solid var(--border-s);}
.verdict-badge{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:2px;flex-shrink:0;background:var(--str-bg);color:var(--str-txt);border:1px solid var(--str-brd);}
.verdict-text{font-size:13px;color:var(--txt2);line-height:1.7;}
.verdict-text strong{color:var(--txt);}
.steps-sec{padding:20px 24px;}
.step-item{display:grid;grid-template-columns:32px 1fr;gap:16px;padding:18px 0;border-bottom:1px solid var(--border-s);align-items:start;}
.step-item:last-child{border-bottom:none;}
.step-num{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:900;color:var(--green);line-height:1;}
.step-title{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--txt);margin-bottom:6px;}
.step-body{font-size:13px;color:var(--txt2);line-height:1.75;}

/* Marketing view */
.mkt-hero{padding:24px;background:linear-gradient(135deg,var(--bg-el) 0%,var(--bg-card) 100%);border-bottom:1px solid var(--border-s);display:flex;align-items:flex-start;gap:20px;}
.mkt-text{flex:1;}
.mkt-tagline{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;line-height:1.1;margin-bottom:8px;}
.mkt-tagline em{font-style:normal;color:var(--green);}
.mkt-sub{font-size:12px;color:var(--txt2);line-height:1.65;}
.mkt-badges{display:flex;flex-direction:column;gap:6px;align-items:flex-end;flex-shrink:0;}
.mkt-badge{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;padding:5px 12px;border-radius:2px;}
.mkt-badge.g{background:var(--str-bg);border:1px solid var(--str-brd);color:var(--str-txt);}
.mkt-badge.b{background:var(--prj-bg);border:1px solid var(--prj-brd);color:var(--prj-txt);}
.mkt-nums{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--border-s);}
.mkt-num{padding:16px;border-right:1px solid var(--border-s);text-align:center;}
.mkt-num:last-child{border-right:none;}
.mkt-num-val{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:900;color:var(--green);line-height:1;margin-bottom:4px;}
.mkt-num-lbl{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;}
.mkt-num-ctx{font-size:9px;color:var(--muted);line-height:1.4;}
.mkt-pillars{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--border-s);}
.mkt-pillar{padding:18px 20px;border-right:1px solid var(--border-s);}
.mkt-pillar:last-child{border-right:none;}
.mkt-pillar-icon{font-size:18px;margin-bottom:6px;}
.mkt-pillar-title{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--green);margin-bottom:5px;}
.mkt-pillar-body{font-size:11px;color:var(--txt2);line-height:1.65;}

/* Buttons */
.btn{border:none;border-radius:4px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Barlow',sans-serif;text-decoration:none;display:inline-block;padding:9px 18px;}
.btn-outline{background:transparent;color:var(--txt2);border:1px solid var(--border);}
.btn-outline:hover{background:var(--bg-el);}
.btn-primary{background:var(--green);color:#000;}
.btn-primary:hover{opacity:.9;}
.btn-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;}

/* Coach Notes tab */
.cn-entry{padding:0;}
.cn-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:18px 20px 14px;border-bottom:1px solid var(--border-s);}
.cn-coach{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:800;color:var(--txt);text-transform:uppercase;letter-spacing:.04em;}
.cn-meta{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:4px;}
.cn-grade{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:900;color:#fff;background:linear-gradient(135deg,#7c3aed,#4f46e5);border-radius:6px;padding:6px 16px;text-align:center;line-height:1;flex-shrink:0;}
.cn-grade-lbl{display:block;font-family:'IBM Plex Mono',monospace;font-size:7px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;opacity:.8;margin-top:3px;}
.cn-block{padding:12px 20px;border-bottom:1px solid var(--border-s);}
.cn-block:last-of-type{border-bottom:none;}
.cn-block-lbl{font-family:'IBM Plex Mono',monospace;font-size:9px;color:#a78bfa;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;font-weight:600;}
.cn-block ul{margin:0;padding-left:18px;}
.cn-block li{font-size:12px;color:var(--txt2);line-height:1.7;}
.cn-text{font-size:12px;color:var(--txt2);line-height:1.7;white-space:pre-wrap;}
.cn-disclaimer{padding:10px 20px;font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:.06em;font-style:italic;background:var(--bg-el);}
.cn-form-row{display:flex;flex-direction:column;gap:5px;}
.cn-form-lbl{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;}
.cn-form-hint{font-size:10px;color:var(--muted);font-style:italic;}
.cn-form-row input,.cn-form-row select,.cn-form-row textarea{background:var(--bg-el);border:1px solid var(--border);border-radius:3px;color:var(--txt);font-family:'Barlow',sans-serif;font-size:13px;padding:8px 10px;resize:vertical;}
.cn-form-row input:focus,.cn-form-row select:focus,.cn-form-row textarea:focus{outline:none;border-color:#7c3aed;}
.cn-form-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.cn-empty{text-align:center;padding:40px 24px;font-size:12px;color:var(--muted);}
.cn-error{font-size:11px;color:var(--red);min-height:14px;}
@media(max-width:640px){.cn-form-grid{grid-template-columns:1fr;}.cn-head{flex-direction:column;}}

@media(max-width:900px){.player-header,.scout-grid{grid-template-columns:180px 1fr;}}
@media(max-width:640px){
  .player-header,.scout-grid{grid-template-columns:1fr;}
  .photo-col,.info-col{border-right:none;border-bottom:1px solid var(--border);}
  .proj-footer{grid-template-columns:1fr 1fr;}
  .htr{grid-template-columns:1fr;}
  .mkt-nums,.mkt-pillars{grid-template-columns:1fr 1fr;}
  .metric-row{grid-template-columns:1fr;}.metric-val{text-align:left;}
  .snav-links{display:none;}
  .toggle-wrap{bottom:12px;right:12px;}
}
@media print{.snav,.toggle-wrap,.btn-row{display:none!important;}.pw{padding:0;max-width:100%;}.card{break-inside:avoid;}}
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <img src="/nexttierlogo.png" alt="Next Tier" style="height:56px">
</div>

<div class="toggle-wrap" onclick="toggleTheme()" role="button">
  <span class="toggle-lbl" id="toggleLbl">Light Mode</span>
  <div class="toggle-sw"></div>
</div>

<nav class="snav" id="snav" style="display:none">
  <a href="/" class="snav-brand"><img src="/nexttierlogo.png" alt="Next Tier" style="height:28px"></a>
  <div class="snav-links">
    <a class="snav-link active" id="lnk-s1" href="#s1" onclick="lnkClick(this,'scout')">Player Card</a>
    <a class="snav-link" id="lnk-s2" href="#s2" onclick="lnkClick(this,'scout')">Scout Report</a>
    <a class="snav-link" id="lnk-s3" href="#s3" onclick="lnkClick(this,'scout')">Dev Notes</a>
    <a class="snav-link" id="lnk-parent" href="#views" onclick="lnkClick(this,'parent');return false">Parent View</a>
    <a class="snav-link" id="lnk-market" href="#views" onclick="lnkClick(this,'market');return false">Player Marketing</a>
    <a class="snav-link" id="lnk-coach" href="#views" onclick="lnkClick(this,'coach');return false" style="display:none">Coach Notes</a>
  </div>
  <div class="snav-right">
    <span class="snav-user" id="snavUser"></span>
    <button class="snav-logout" onclick="NT.logout()">Log out</button>
  </div>
</nav>

<div class="pw" id="root"></div>
<div class="pw" id="statePending" style="display:none"></div>

<script>
function toggleTheme(){
  const h=document.documentElement,dark=h.getAttribute('data-theme')==='dark';
  h.setAttribute('data-theme',dark?'light':'dark');
  document.getElementById('toggleLbl').textContent=dark?'Dark Mode':'Light Mode';
}

function switchView(name){
  document.querySelectorAll('[data-view]').forEach(el=>el.style.display=el.dataset.view===name?'':'none');
}
function lnkClick(el,view){
  document.querySelectorAll('.snav-link').forEach(a=>a.classList.remove('active'));
  el.classList.add('active');
  switchView(view);
}

function esc(s){const d=document.createElement('div');d.textContent=s??'—';return d.innerHTML;}
function bc(n){return n>=75?'green':n>=55?'yellow':'red';}
function tierFromPDS(n){return n>=85?'A+':n>=75?'A':n>=65?'B+':n>=55?'B':n>=45?'C+':n>=35?'C':'D';}
function fmtDate(iso){return iso?new Date(iso).toLocaleDateString('en-CA',{year:'numeric',month:'short',day:'numeric'}):'—';}

function skillBarHTML(sk){
  const s=Math.round(sk.score??sk.value??0),c=sk.color||bc(s),n=esc(sk.label??sk.name??'—');
  return `<div class="skill-row"><div class="skill-name">${n}</div><div class="skill-bar-wrap"><div class="skill-bar-bg"><div class="skill-bar-fill fill-${c}" style="width:${s}%"><div class="skill-bubble bubble-${c}">${s}</div></div></div></div></div>${sk.note?`<div class="skill-note">${esc(sk.note)}</div>`:''}`;
}

function photoPlaceholder(){
  return '<svg width="40" height="40" viewBox="0 0 60 60" fill="currentColor" style="opacity:.3"><circle cx="30" cy="20" r="12"/><path d="M8 52c0-12.15 9.85-22 22-22s22 9.85 22 22"/></svg>';
}

function renderFull(P, product){
  const pds  = P.pds ?? product.pdsScore ?? '—';
  const t    = P.tier ?? (isNaN(+pds) ? '—' : tierFromPDS(+pds));
  const tLbl = P.tierLabel || '';
  const num  = P.number ?? product.jerseyNumber ?? '—';
  const fn   = P.firstName ?? product.firstName ?? '';
  const ln   = P.lastName  ?? product.lastName  ?? '';
  const name = [fn,ln].filter(Boolean).join(' ') || '—';
  const pos  = P.position ?? product.position ?? '—';
  const tm   = P.team     ?? product.team     ?? '—';
  const lg   = P.league   ?? product.league   ?? '—';
  const rId  = P.reportId || '';
  const rDate= P.reportDate || fmtDate(product.createdAt);
  const S    = P.stats || {};
  if(S.gp && S.pts && !S.ptsPerGP) S.ptsPerGP = (S.pts/S.gp).toFixed(2);

  document.getElementById('page-title').textContent = name+' · Player Card · Next Tier';
  document.getElementById('snav').style.display = '';
  document.getElementById('snavUser').textContent = name;

  // Career rows
  const cRows = (P.career||[]).map(r=>{
    const pg=r.pts&&r.gp?(r.pts/r.gp).toFixed(2):'—';
    return `<tr${r.current?' class="cur"':''}><td>${esc(r.season)}${r.current?'<span class="star">★</span>':''}</td><td>${esc(r.team)}</td><td>${esc(r.league)}</td><td>${r.gp??'—'}</td><td>${r.g??'—'}</td><td>${r.a??'—'}</td><td>${r.pts??'—'}</td><td>${r.pim??'—'}</td><td>${pg}</td></tr>`;
  }).join('');
  const fallbackRow = !cRows && S.gp ? `<tr class="cur"><td>${esc(P.season||'—')}</td><td>${esc(tm)}</td><td>${esc(lg)}</td><td>${S.gp}</td><td>${S.g??'—'}</td><td>${S.a??'—'}</td><td>${S.pts??'—'}</td><td>${S.pim??'—'}</td><td>${S.ptsPerGP||'—'}</td></tr>` : '';

  // Info rows
  const infoRows = P.infoRows || [
    {label:'Position',value:pos},{label:'Team',value:tm},{label:'League',value:lg},
    {label:'Jersey',value:num!=='—'?'#'+num:'—'},{label:'Season',value:P.season||'—'},
    {label:'Height',value:P.height||'—'},{label:'Weight',value:P.weight||'—'},
    {label:'Born',value:P.birthYear||'—',style:'orange'},{label:'Hometown',value:P.hometown||'—'},
  ];

  // Dev notes
  const devNotes = (P.devNotes||[]).map(n=>{
    if(typeof n==='string') return `<div class="note-sec"><div class="note-body">${n}</div></div>`;
    const type=n.type||(n.label?.toLowerCase().includes('flag')?'flag':n.label?.toLowerCase().includes('proj')?'proj':'strength');
    const cls=type==='flag'?'nb-flg':type==='proj'?'nb-prj':'nb-str';
    const lbl=type==='flag'?'Development Flag':type==='proj'?'Projection / Context':'Strength';
    return `<div class="note-sec"><div class="note-head"><span class="note-badge ${cls}">${lbl}</span>${n.title||n.label?`<span class="note-title">${esc(n.title||n.label)}</span>`:''}</div><div class="note-body">${n.body||n.text||esc(n.note)||''}</div></div>`;
  }).join('');

  // Pathway rows
  const pwCols = (P.pathways||[]).some(p=>p.notes||p.note)
    ? '<th>Pathway</th><th>Match</th><th>Timeline</th><th>Notes</th>'
    : '<th>Pathway</th><th>Match</th><th>Timeline</th>';
  const pwRows = (P.pathways||[]).map(p=>{
    const pct=Math.round(+(p.probability||p.pct)||0);
    const color=pct>=70?'green':pct>=50?'orange':'red';
    return `<tr><td><span class="pw-name">${esc(p.label??p.pathway??p.name??'—')}</span>${p.sub?`<span class="pw-sub">${esc(p.sub)}</span>`:''}</td><td><div class="match-pct ${color}">${pct}%</div></td><td><div class="tl-val">${esc(p.timeline||'—')}</div></td>${p.notes||p.note?`<td style="font-size:11px;color:var(--muted)">${esc(p.notes||p.note)}</td>`:''}</tr>`;
  }).join('');

  // Parent metrics
  const pmRows = (P.parentMetrics||[]).map(m=>{
    const vc=m.signal==='red'?'r':m.signal==='yellow'?'y':'g';
    return `<div class="metric-row"><div><div class="metric-label">${esc(m.metric||m.label||m.title)}</div><div class="metric-ctx">${esc(m.context||m.desc||'')}</div></div><div class="metric-desc">${esc(m.note||m.benchmark||'')}</div><div class="metric-val ${vc}">${esc(m.value||'')}</div></div>`;
  }).join('');

  // Parent steps
  const psRows = (P.parentSteps||[]).map((s,i)=>{
    const title=typeof s==='string'?s:(s.title||s.step||'');
    const body=typeof s==='string'?'':(s.body||s.desc||'');
    return `<div class="step-item"><div class="step-num">${i+1}</div><div><div class="step-title">${esc(title)}</div>${body?`<div class="step-body">${esc(body)}</div>`:''}</div></div>`;
  }).join('');

  // Marketing pillars
  const defaultPillars = [{title:'PDS '+pds,body:'Player Development Score — across 14 evaluated metrics'},{title:'Tier '+t+(tLbl?' · '+tLbl:''),body:'Rating tier assigned by Next Tier evaluators'},{title:pos,body:'Evaluated position — '+lg}];
  const pillarsHTML = (P.mktPillars||defaultPillars).map(p=>`<div class="mkt-pillar">${p.icon?`<div class="mkt-pillar-icon">${p.icon}</div>`:''}<div class="mkt-pillar-title">${esc(p.title||p.label)}</div><div class="mkt-pillar-body">${p.body||p.desc||p.description||''}</div></div>`).join('');

  const mktNums = P.mktNumbers ? P.mktNumbers.map(n=>`<div class="mkt-num"><div class="mkt-num-val">${esc(n.val)}</div><div class="mkt-num-lbl">${esc(n.label)}</div><div class="mkt-num-ctx">${esc(n.ctx||'')}</div></div>`).join('')
    : `<div class="mkt-num"><div class="mkt-num-val">${pds}</div><div class="mkt-num-lbl">PDS Score</div><div class="mkt-num-ctx">Out of 100</div></div><div class="mkt-num"><div class="mkt-num-val">${t}</div><div class="mkt-num-lbl">Tier</div><div class="mkt-num-ctx">${tLbl}</div></div><div class="mkt-num"><div class="mkt-num-val">${esc(pos)}</div><div class="mkt-num-lbl">Position</div><div class="mkt-num-ctx">${esc(lg)}</div></div><div class="mkt-num"><div class="mkt-num-val">${num!=='—'?'#'+num:'—'}</div><div class="mkt-num-lbl">Jersey</div><div class="mkt-num-ctx">${esc(tm)}</div></div>`;

  const projHTML = (P.pdsProjected||P.reEval||P.nextLevel) ? `<div class="proj-footer" style="border-top:1px solid var(--border)"><div class="proj-cell"><div class="proj-key">Current PDS</div><div class="proj-val">${pds}</div></div><div class="proj-cell"><div class="proj-key">Projected PDS</div><div class="proj-val g">${P.pdsProjected||'—'}</div></div><div class="proj-cell"><div class="proj-key">Re-Eval</div><div class="proj-val o">${P.reEval||'—'}</div></div><div class="proj-cell"><div class="proj-key">Next Level</div><div class="proj-val b">${P.nextLevel||'—'}</div></div></div>` : '';

  const htrHTML = (P.htrItems||[]).length ? `<div style="border-top:1px solid var(--border)"><div style="padding:10px 20px;background:var(--bg-el);border-bottom:1px solid var(--border-s)"><span style="font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase">HOW TO READ THIS CARD</span></div><div class="htr">${P.htrItems.map(h=>`<div class="htr-item"><div class="htr-num">${esc(h.num)}</div><div class="htr-title">${esc(h.title)}</div><div class="htr-body">${esc(h.body)}</div></div>`).join('')}</div></div>` : '';

  const coachNoteHTML = P.coachNote ? `<div class="coach-note"><div class="coach-note-lbl">Coach / Evaluator Notes</div><div class="coach-note-txt">${esc(P.coachNote)}</div></div>` : '';

  const execHTML = P.execSummary ? `<div class="exec-box"><div class="exec-title">Next Tier Assessment</div><div class="exec-body">${esc(P.execSummary)}</div></div>` : '';

  const skillsBlock = (P.skills||[]).length ? `<div class="skill-axis"><span class="axis-lbl">Poor</span><span class="axis-lbl">Average</span><span class="axis-lbl">Great</span></div>${P.skills.map(skillBarHTML).join('')}` : '';
  const pwBlock = pwRows ? `<div style="margin-top:16px"><div class="glance-lbl" style="margin-bottom:10px">03 · Pathway Assessment</div><table class="pw-tbl"><thead><tr>${pwCols}</tr></thead><tbody>${pwRows}</tbody></table></div>` : '';

  const parentIntro = (P.parentNarrative&&P.parentNarrative.intro) || `Your player earned a Player Development Score of <strong>${pds}</strong>, placing them in the ${t} tier across 14 evaluated metrics.`;

  if (!devNotes) document.getElementById('lnk-s3').style.display = 'none';

  document.getElementById('root').innerHTML = `
<div data-view="scout">
  <div id="s1" class="sec-lbl" style="scroll-margin-top:52px"><span>Page 1 · Player Card</span><span>${rId}</span></div>
  <div class="card">
    <div class="player-header">
      <div class="photo-col">
        <div class="player-photo">${P.photoSrc?`<img src="${esc(P.photoSrc)}" style="width:100%;height:100%;object-fit:cover;object-position:center top" alt="${esc(name)}">`:photoPlaceholder()}</div>
        <div class="player-name">${esc(fn)}<br>${esc(ln)}</div>
        <div class="team-info">${esc(tm)} · ${esc(lg)} · ${esc(pos)}</div>
        ${P.birthYear||P.age?`<div class="tag-row"><span class="tag">${P.birthYear||''}${P.birthYear&&P.age?' · ':''}${P.age?'Age '+P.age:''}</span></div>`:''}
        ${P.height||P.weight?`<div class="tag-row"><span class="tag">${esc(P.height||'')}${P.height&&P.weight?' · ':''}${esc(P.weight||'')}</span></div>`:''}
        ${P.hometown?`<div class="tag-row"><span class="tag">${esc(P.hometown.toUpperCase())}</span></div>`:''}
        <div class="pds-badge" style="margin-top:8px"><div class="pds-num">${pds}</div><div class="pds-key">Player Dev Score</div></div>
        <div class="tag-row"><span class="tag g">Tier ${t}${tLbl?' · '+tLbl:''}</span></div>
      </div>
      <div class="stats-col">
        ${S.g!==undefined?`<div class="glance-lbl">Season at a Glance · ${esc(P.season||'')}</div>
        <div class="stat-boxes"><div class="stat-box"><div class="stat-val g">${S.g}</div><div class="stat-key">Goals</div></div><div class="stat-box"><div class="stat-val g">${S.a}</div><div class="stat-key">Assists</div></div><div class="stat-box"><div class="stat-val g">${S.pts}</div><div class="stat-key">Points</div></div><div class="stat-box"><div class="stat-val g">${S.gp}</div><div class="stat-key">Games</div></div></div>
        <div class="stat-boxes r3" style="margin-top:7px"><div class="stat-box"><div class="stat-val g">${S.ptsPerGP||'—'}</div><div class="stat-key">Pts / GP</div></div><div class="stat-box"><div class="stat-val">${S.ppg??'—'}</div><div class="stat-key">PP Goals</div></div><div class="stat-box"><div class="stat-val">${S.pim??'—'}</div><div class="stat-key">PIM</div></div></div>`:''}
        ${cRows||fallbackRow?`<div style="margin-top:8px"><div class="glance-lbl" style="margin-bottom:6px">Career History</div><div class="career-wrap"><table class="ctbl"><thead><tr><th>Season</th><th>Team</th><th>Lge</th><th>GP</th><th>G</th><th>A</th><th>Pts</th><th>PIM</th><th>Pts/GP</th></tr></thead><tbody>${cRows||fallbackRow}</tbody></table></div></div>`:''}
      </div>
    </div>
    ${coachNoteHTML}
    <div class="doc-footer"><div class="footer-id">Next Tier · ${rId} · ${rDate}</div><div class="footer-brand">Next Tier</div></div>
  </div>

  <div id="s2" class="sec-lbl" style="scroll-margin-top:52px"><span>Page 2 · Scout Assessment · ${rId}</span><span>Next Tier · ${rDate}</span></div>
  <div class="card">
    <div class="scout-grid">
      <div class="info-col">
        <table class="info-tbl"><tbody>${infoRows.map(r=>`<tr><td class="info-lbl">${esc(r.label)}</td><td class="info-val${r.style?' '+r.style:''}">${esc(r.value)}</td></tr>`).join('')}</tbody></table>
        ${execHTML}
        <div class="legend-box"><div class="legend-title">Legend</div><div class="legend-item"><div class="l-dot l-g"></div>Green ≥75 — top quartile vs. cohort</div><div class="legend-item"><div class="l-dot l-y"></div>Yellow 55–74 — above average</div><div class="legend-item"><div class="l-dot l-r"></div>Red &lt;55 — development priority</div></div>
      </div>
      <div class="skills-col">${skillsBlock||''}${pwBlock}</div>
    </div>
    <div class="doc-footer"><div class="footer-id">Next Tier · ${rId} · Scout Report · ${rDate}</div><div class="footer-brand">Next Tier</div></div>
  </div>

  ${devNotes?`<div id="s3" class="sec-lbl" style="scroll-margin-top:52px"><span>Page 3 · Development Notes · Confidential</span><span>Next Tier Scout Notes — ${rDate}</span></div>
  <div class="card"><div class="conf-bar">Confidential · Next Tier · ${rId}</div>${devNotes}${projHTML}${htrHTML}<div class="doc-footer"><div class="footer-id">Next Tier · ${rId} · AI Engine · ${rDate}</div><div class="footer-brand">Next Tier</div></div></div>`:''}

  <div class="btn-row"><a href="/dashboard-player" class="btn btn-outline">← Dashboard</a><button class="btn btn-outline" onclick="window.print()">Print / Save PDF</button><a href="/contact" class="btn btn-outline">Contact support</a></div>
</div>

<div data-view="parent" style="display:none" id="views">
  <div class="sec-lbl"><span>Parent View · ${esc(name)}</span></div>
  <div class="card">
    <div class="parent-hero"><div style="flex:1"><div class="parent-name">${esc(name)}</div><div class="parent-sub">${esc(pos)} · ${esc(tm)} · ${esc(lg)}</div></div><div class="parent-ring"><div class="parent-ring-num">${pds}</div><div class="parent-ring-key">PDS</div></div></div>
    ${pmRows||`<div style="padding:20px 24px;font-size:13px;color:var(--txt2);line-height:1.75">${parentIntro}</div>`}
    ${P.parentVerdict?`<div class="verdict-row"><span class="verdict-badge">Overall Verdict</span><div class="verdict-text">${esc(P.parentVerdict)}</div></div>`:''}
    ${psRows?`<div class="steps-sec"><div style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:14px">Recommended Next Steps</div>${psRows}</div>`:''}
  </div>
  <div class="btn-row"><a href="/dashboard-player" class="btn btn-outline">← Dashboard</a><a href="/contact" class="btn btn-outline">Contact support</a></div>
</div>

<div data-view="market" style="display:none">
  <div class="sec-lbl"><span>Player Marketing · ${esc(name)}</span></div>
  <div class="card">
    <div class="mkt-hero"><div class="mkt-text"><div class="mkt-tagline">${esc(P.mktTaglineWord1||'Built for')}<br><em>${esc(P.mktTaglineEm1||'Next Level')}</em></div><div class="mkt-sub">${esc(P.mktSub||name+' · '+pos+' · '+tm)}</div></div><div class="mkt-badges"><span class="mkt-badge g">PDS ${pds} · Tier ${t}</span><span class="mkt-badge b">${esc(lg)}</span></div></div>
    <div class="mkt-nums">${mktNums}</div>
    <div class="mkt-pillars">${pillarsHTML}</div>
  </div>
  <div class="btn-row"><button class="btn btn-primary" onclick="window.print()">Download PDF</button><a href="/dashboard-player" class="btn btn-outline">← Dashboard</a></div>
</div>

<div data-view="coach" style="display:none">
  <div id="coachTabBody"></div>
</div>`;
}

function renderSimple(product){
  const pds  = product.pdsScore || '—';
  const t    = isNaN(+pds) ? '—' : tierFromPDS(+pds);
  const name = [product.firstName, product.lastName].filter(Boolean).join(' ') || '—';
  const num  = product.jerseyNumber || '—';
  const pos  = product.position || '—';
  const tm   = product.team || '—';
  const lg   = product.league || '—';

  document.getElementById('page-title').textContent = name+' · Player Card · Next Tier';
  document.getElementById('snav').style.display = '';
  document.getElementById('snavUser').textContent = name;
  document.getElementById('lnk-s2').style.display = 'none';
  document.getElementById('lnk-s3').style.display = 'none';

  const infoRows = [{l:'Player',v:name},{l:'Position',v:pos},{l:'Jersey',v:num!=='—'?'#'+num:'—'},{l:'Team',v:tm},{l:'League',v:lg},{l:'Package',v:product.package||'—'}];
  const infoHTML = infoRows.map(r=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border-s);font-size:13px"><span style="color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.08em">${r.l}</span><span style="color:var(--txt)">${esc(r.v)}</span></div>`).join('');

  document.getElementById('root').innerHTML = `
<div data-view="scout">
  <div id="s1" class="sec-lbl"><span>Player Card · ${esc(name)}</span><span>Submitted ${fmtDate(product.createdAt)}</span></div>
  <div class="card">
    <div class="player-header">
      <div class="photo-col">
        <div class="player-photo">${photoPlaceholder()}</div>
        <div class="player-name">${esc(name)}</div>
        <div class="team-info">${esc(tm)} · ${esc(lg)} · ${esc(pos)}</div>
        <div class="pds-badge" style="margin-top:8px"><div class="pds-num">${pds}</div><div class="pds-key">Player Dev Score</div></div>
        <div class="tag-row"><span class="tag g">Tier ${t}</span></div>
      </div>
      <div class="stats-col"><div class="glance-lbl">Player Info</div><div style="margin-top:12px">${infoHTML}</div></div>
    </div>
    <div class="doc-footer"><div class="footer-id">Next Tier · Submitted ${fmtDate(product.createdAt)}</div><div class="footer-brand">Next Tier</div></div>
  </div>
  <div class="btn-row"><a href="/dashboard-player" class="btn btn-outline">← Dashboard</a><button class="btn btn-outline" onclick="window.print()">Print</button></div>
</div>
<div data-view="parent" style="display:none" id="views">
  <div class="sec-lbl"><span>Parent View · ${esc(name)}</span></div>
  <div class="card">
    <div class="parent-hero"><div style="flex:1"><div class="parent-name">${esc(name)}</div><div class="parent-sub">${esc(pos)} · ${esc(tm)}</div></div><div class="parent-ring"><div class="parent-ring-num">${pds}</div><div class="parent-ring-key">PDS</div></div></div>
    <div style="padding:20px 24px;font-size:13px;color:var(--txt2);line-height:1.75">Your player earned a PDS of <strong>${pds}</strong> (Tier ${t}). A detailed breakdown will be available once the full review is complete.</div>
  </div>
  <div class="btn-row"><a href="/dashboard-player" class="btn btn-outline">← Dashboard</a></div>
</div>
<div data-view="market" style="display:none">
  <div class="sec-lbl"><span>Player Marketing · ${esc(name)}</span></div>
  <div class="card">
    <div class="mkt-hero"><div class="mkt-text"><div class="mkt-tagline">Built for<br><em>Next Level</em></div><div class="mkt-sub">${esc(name+' · '+pos+' · '+tm)}</div></div><div class="mkt-badges"><span class="mkt-badge g">PDS ${pds} · Tier ${t}</span><span class="mkt-badge b">${esc(lg)}</span></div></div>
    <div class="mkt-nums"><div class="mkt-num"><div class="mkt-num-val">${pds}</div><div class="mkt-num-lbl">PDS Score</div><div class="mkt-num-ctx">Out of 100</div></div><div class="mkt-num"><div class="mkt-num-val">${t}</div><div class="mkt-num-lbl">Tier</div></div><div class="mkt-num"><div class="mkt-num-val">${esc(pos)}</div><div class="mkt-num-lbl">Position</div><div class="mkt-num-ctx">${esc(lg)}</div></div><div class="mkt-num"><div class="mkt-num-val">${num!=='—'?'#'+num:'—'}</div><div class="mkt-num-lbl">Jersey</div><div class="mkt-num-ctx">${esc(tm)}</div></div></div>
  </div>
  <div class="btn-row"><button class="btn btn-primary" onclick="window.print()">Download PDF</button><a href="/dashboard-player" class="btn btn-outline">← Dashboard</a></div>
</div>

<div data-view="coach" style="display:none">
  <div id="coachTabBody"></div>
</div>`;
}

function renderPending(backHref){
  backHref = backHref || '/dashboard-player';
  document.getElementById('statePending').style.display = '';
  document.getElementById('statePending').innerHTML = `<div id="coachTabBody"></div>
  <div class="btn-row" style="justify-content:center"><a href="${esc(backHref)}" class="btn btn-outline">← Dashboard</a><a href="/contact" class="btn btn-outline">Questions? Contact us</a></div>`;
}

function renderNoEval(name, backHref){
  document.getElementById('page-title').textContent = (name||'Player')+' · Player Card · Next Tier';
  document.getElementById('statePending').style.display = '';
  document.getElementById('statePending').innerHTML = `<div class="card">
    <div class="sec-lbl"><span>${esc(name||'Player')}</span></div>
    <div style="padding:28px 20px;text-align:center;color:var(--muted);font-size:13px">No evaluation has been ordered for this player yet — Coach Notes can still be added below.</div>
  </div>
  <div id="coachTabBody"></div>
  <div class="btn-row" style="justify-content:center"><a href="${esc(backHref)}" class="btn btn-outline">← Dashboard</a></div>`;
}

// ── Coach Notes tab ────────────────────────────────────────────
const COACH_GRADE_OPTS = ['A','B','C','D','F'];
const COACH_ROLE_OPTS  = ['Top-Line / Top-Pair','Middle-Six','Bottom-Six / Third-Pair','Depth / Project','Not Yet Projectable'];
let _coachCtx = { playerId: null, canEdit: false, defaultTeam: '', canEditExisting: false, notes: [] };

function coachNoteCardHTML(n, canEditExisting){
  const strengths = (n.strengths||[]).map(s=>`<li>${esc(s)}</li>`).join('');
  const areas     = (n.areasImprovement||[]).map(s=>`<li>${esc(s)}</li>`).join('');
  const metaParts = [n.coachTitle, n.team].filter(Boolean);
  const editedLbl = n.updatedAt ? ` · <span title="Edited ${esc(fmtDate(n.updatedAt))}">edited</span>` : '';
  return `<div class="card">
    <div class="cn-entry">
      <div class="cn-head">
        <div>
          <div class="cn-coach">${esc(n.coachName)}</div>
          <div class="cn-meta">${metaParts.map(esc).join(' · ')}${metaParts.length?' · ':''}${fmtDate(n.entryDate)}${editedLbl}</div>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          ${canEditExisting ? `<button class="btn btn-outline" style="padding:5px 12px;font-size:10px" onclick="editCoachNote('${esc(n.id)}')">Edit</button>` : ''}
          <div class="cn-grade">${esc(n.overallGrade)}<span class="cn-grade-lbl">Coach Grade</span></div>
        </div>
      </div>
      ${strengths?`<div class="cn-block"><div class="cn-block-lbl">Strengths</div><ul>${strengths}</ul></div>`:''}
      ${areas?`<div class="cn-block"><div class="cn-block-lbl">Areas for Improvement</div><ul>${areas}</ul></div>`:''}
      ${n.coachability?`<div class="cn-block"><div class="cn-block-lbl">Coachability / Attitude</div><div class="cn-text">${esc(n.coachability)}</div></div>`:''}
      ${n.practiceVsGame?`<div class="cn-block"><div class="cn-block-lbl">Practice vs. Game Performance</div><div class="cn-text">${esc(n.practiceVsGame)}</div></div>`:''}
      ${n.projectedRole?`<div class="cn-block"><div class="cn-block-lbl">Projected Role Next Season</div><div class="cn-text">${esc(n.projectedRole)}</div></div>`:''}
      ${n.generalComments?`<div class="cn-block"><div class="cn-block-lbl">General Comments</div><div class="cn-text">${esc(n.generalComments)}</div></div>`:''}
    </div>
    <div class="cn-disclaimer">Coach evaluation — subjective, not derived from statistical model</div>
  </div>`;
}

function coachFormHTML(defaultTeam, editingNote){
  const n = editingNote || null;
  return `<div class="card">
    <div class="sec-lbl" style="margin:0;padding:14px 20px;border-bottom:1px solid var(--border-s)"><span>${n?'Edit Coach Evaluation':'New Coach Evaluation'}</span></div>
    <div style="padding:18px 20px;display:flex;flex-direction:column;gap:14px">
      <div class="cn-form-grid">
        <div class="cn-form-row"><label class="cn-form-lbl">Role / Title</label><input id="cnTitle" type="text" placeholder="e.g. Head Coach" value="${esc(n?.coachTitle||'')}"></div>
        <div class="cn-form-row"><label class="cn-form-lbl">Team</label><input id="cnTeam" type="text" placeholder="Team" value="${esc(n?.team||defaultTeam||'')}"></div>
        <div class="cn-form-row"><label class="cn-form-lbl">Overall Grade</label><select id="cnGrade">${COACH_GRADE_OPTS.map(g=>`<option${g===(n?.overallGrade||'C')?' selected':''}>${g}</option>`).join('')}</select></div>
      </div>
      <div class="cn-form-row"><label class="cn-form-lbl">Strengths</label><span class="cn-form-hint">2–4 short bullets, one per line</span><textarea id="cnStrengths" rows="3">${esc((n?.strengths||[]).join('\n'))}</textarea></div>
      <div class="cn-form-row"><label class="cn-form-lbl">Areas for Improvement</label><span class="cn-form-hint">2–4 short bullets, one per line</span><textarea id="cnAreas" rows="3">${esc((n?.areasImprovement||[]).join('\n'))}</textarea></div>
      <div class="cn-form-grid">
        <div class="cn-form-row"><label class="cn-form-lbl">Coachability / Attitude</label><select id="cnCoachability"><option value="">—</option>${(()=>{const cur=n?(n.coachability||''):'3';return [1,2,3,4,5].map(v=>`<option${String(v)===String(cur)?' selected':''}>${v}</option>`).join('');})()}</select></div>
        <div class="cn-form-row" style="grid-column:span 2"><label class="cn-form-lbl">Projected Role Next Season</label><select id="cnRole"><option value="">—</option>${COACH_ROLE_OPTS.map(r=>`<option${r===(n?.projectedRole||'')?' selected':''}>${esc(r)}</option>`).join('')}</select></div>
      </div>
      <div class="cn-form-row"><label class="cn-form-lbl">Practice vs. Game Performance</label><textarea id="cnPvG" rows="2" placeholder="e.g. great in practice, disappears in games — or vice versa">${esc(n?.practiceVsGame||'')}</textarea></div>
      <div class="cn-form-row"><label class="cn-form-lbl">General Comments</label><textarea id="cnComments" rows="4">${esc(n?.generalComments||'')}</textarea></div>
      <div class="cn-error" id="cnError"></div>
      <div class="btn-row">
        <button class="btn btn-primary" id="cnSubmitBtn" onclick="submitCoachNote()">${n?'Save Changes':'Submit Evaluation'}</button>
        ${n?`<button class="btn btn-outline" onclick="cancelEditCoachNote()">Cancel</button>`:''}
      </div>
    </div>
  </div>`;
}

function editCoachNote(noteId){
  const note = (_coachCtx.notes||[]).find(n => n.id === noteId);
  if (!note) return;
  _coachCtx.editingNoteId = noteId;
  renderCoachTab();
  document.getElementById('coachTabBody').scrollIntoView({behavior:'smooth', block:'start'});
}

function cancelEditCoachNote(){
  _coachCtx.editingNoteId = null;
  renderCoachTab();
}

async function submitCoachNote(){
  const grade = document.getElementById('cnGrade').value;
  const errEl = document.getElementById('cnError');
  errEl.textContent = '';
  if (!grade) { errEl.textContent = 'Overall grade is required.'; return; }

  const strengths = document.getElementById('cnStrengths').value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,4);
  const areas     = document.getElementById('cnAreas').value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,4);

  const btn = document.getElementById('cnSubmitBtn');
  btn.disabled = true; btn.textContent = 'Saving…';

  const editingNoteId = _coachCtx.editingNoteId;
  const payload = {
    token: NT.getToken(), playerId: _coachCtx.playerId,
    coachTitle:       document.getElementById('cnTitle').value.trim(),
    team:             document.getElementById('cnTeam').value.trim(),
    overallGrade:     grade,
    strengths, areasImprovement: areas,
    coachability:     document.getElementById('cnCoachability').value,
    practiceVsGame:   document.getElementById('cnPvG').value.trim(),
    projectedRole:    document.getElementById('cnRole').value,
    generalComments:  document.getElementById('cnComments').value.trim(),
  };
  const res = editingNoteId
    ? await NT.api({ type: 'updateCoachNote', noteId: editingNoteId, ...payload })
    : await NT.api({ type: 'addCoachNote', ...payload });

  if (res.status !== 'ok') {
    errEl.textContent = res.message || 'Failed to save evaluation.';
    btn.disabled = false; btn.textContent = editingNoteId ? 'Save Changes' : 'Submit Evaluation';
    return;
  }
  _coachCtx.editingNoteId = null;
  await loadCoachTab(_coachCtx.playerId, _coachCtx.canEdit, _coachCtx.defaultTeam, _coachCtx.canEditExisting);
}

function renderCoachTab(){
  const body = document.getElementById('coachTabBody');
  if (!body) return;
  const notes = _coachCtx.notes || [];
  const countLbl = notes.length ? ` · ${notes.length} entr${notes.length===1?'y':'ies'}` : '';
  const editingNote = notes.find(n => n.id === _coachCtx.editingNoteId) || null;
  const history = notes.length
    ? notes.map(n => coachNoteCardHTML(n, _coachCtx.canEditExisting)).join('')
    : `<div class="card"><div class="cn-empty">No coach evaluation submitted yet.</div></div>`;

  body.innerHTML = `
    <div class="sec-lbl"><span>Coach Notes${countLbl}</span></div>
    ${_coachCtx.canEdit && !editingNote ? coachFormHTML(_coachCtx.defaultTeam) : ''}
    ${editingNote ? coachFormHTML(_coachCtx.defaultTeam, editingNote) : ''}
    ${history}
  `;
}

async function loadCoachTab(playerId, canEdit, defaultTeam, canEditExisting){
  _coachCtx = { playerId, canEdit, defaultTeam, canEditExisting, notes: [], editingNoteId: null };
  const lnk = document.getElementById('lnk-coach');

  let notes = [];
  try {
    const res = await NT.api({type:'getCoachNotes', token:NT.getToken(), playerId});
    if (res.status==='ok') notes = res.notes || [];
  } catch(_){}

  lnk.style.display = (canEdit || notes.length) ? '' : 'none';
  _coachCtx.notes = notes;
  renderCoachTab();
}

window.addEventListener('DOMContentLoaded', async () => {
  const params   = new URLSearchParams(window.location.search);
  const viewPid  = params.get('pid');
  const viewName = params.get('name') || '';
  const isCoachView = !!viewPid;

  const user = await NT.guard(isCoachView ? ['team','admin','coach'] : ['player','parent']);
  if (!user) return;

  const canEditCoachNotes = ['team','admin','coach'].includes(user.role);
  const canEditExistingCoachNotes = ['team','admin'].includes(user.role);
  const backHref = isCoachView ? (user.role === 'coach' ? '/dashboard-coach' : '/dashboard-team') : '/dashboard-player';

  let product = null;
  try {
    const res = isCoachView
      ? await NT.api({type:'getProductForPlayer', token:NT.getToken(), playerId:viewPid})
      : await NT.api({type:'getProduct', token:NT.getToken()});
    if (res.status==='ok') product = res.product;
  } catch(_){}

  document.getElementById('loadingOverlay').style.display = 'none';

  if (!product) {
    if (!isCoachView) { window.location.href = '/checkout'; return; }
    renderNoEval(viewName, backHref);
    await loadCoachTab(viewPid, canEditCoachNotes, '', canEditExistingCoachNotes);
    return;
  }
  if (product.status !== 'active') {
    renderPending(backHref);
    await loadCoachTab(product.userId, canEditCoachNotes, product.team, canEditExistingCoachNotes);
    return;
  }

  let P = null;
  if (product.pdsScore && typeof product.pdsScore === 'string' && product.pdsScore.trim().startsWith('{')) {
    try { P = JSON.parse(product.pdsScore); } catch(_){}
  } else if (product.pdsScore && typeof product.pdsScore === 'object') {
    P = product.pdsScore;
  }

  if (P) { renderFull(P, product); } else { renderSimple(product); }

  await loadCoachTab(product.userId, canEditCoachNotes, product.team, canEditExistingCoachNotes);
});
</script>
</body>
</html>
